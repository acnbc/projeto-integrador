{% extends "template.html" %}

{% block content %}
<div class="page-header">
    <h1>Usuários</h1>
    <p class="text-muted">Criar, inativar, detalhar e atualizar usuários</p>
</div>

<div class="grid-2">
    <section class="card">
        <h2 class="card-title">Novo usuário</h2>
        <form id="form-usuario" class="form">
            <div class="field">
                <label for="u-nome">Nome</label>
                <input type="text" id="u-nome" maxlength="250" data-maxlength="250" data-char-counter required>
                <span class="char-counter" data-for="u-nome"></span>
            </div>
            <div class="field">
                <label for="u-email">E-mail</label>
                <input type="email" id="u-email" maxlength="250" data-maxlength="250" data-char-counter required>
                <span class="char-counter" data-for="u-email"></span>
            </div>
            <div class="field">
                <label for="u-senha">Senha</label>
                <input type="password" id="u-senha" minlength="8" maxlength="250" data-maxlength="250" data-char-counter required>
                <span class="char-counter" data-for="u-senha"></span>
            </div>
            <div class="field">
                <label for="u-perfil">Perfil</label>
                <select id="u-perfil" required></select>
            </div>
            <button type="submit" class="btn btn-primary">Criar usuário</button>
        </form>
    </section>

    <section class="card">
        <h2 class="card-title">Lista de usuários</h2>
        <div class="table-wrap">
            <table class="table" id="tabela-usuarios">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Perfil</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</div>

<div id="modal-usuario" class="modal-overlay hidden">
    <div class="modal modal-lg">
        <h2 class="modal-title">Detalhes / Editar usuário</h2>
        <form id="form-editar-usuario" class="form">
            <input type="hidden" id="edit-id">
            <div class="field">
                <label for="edit-nome">Nome</label>
                <input type="text" id="edit-nome" maxlength="250" data-maxlength="250" data-char-counter>
                <span class="char-counter" data-for="edit-nome"></span>
            </div>
            <div class="field">
                <label for="edit-email">E-mail</label>
                <input type="email" id="edit-email" maxlength="250" data-maxlength="250" data-char-counter>
                <span class="char-counter" data-for="edit-email"></span>
            </div>
            <div class="field">
                <label for="edit-senha">Nova senha (opcional)</label>
                <input type="password" id="edit-senha" minlength="8" maxlength="250" data-maxlength="250" data-char-counter>
                <span class="char-counter" data-for="edit-senha"></span>
            </div>
            <div class="field">
                <label for="edit-perfil">Perfil</label>
                <select id="edit-perfil"></select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" id="btn-fechar-usuario">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
                <button type="button" class="btn btn-danger" id="btn-inativar-usuario">Inativar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/usuarios.js"></script>
{% endblock %}
