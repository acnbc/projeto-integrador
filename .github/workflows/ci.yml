name: CI

on:
  push:
    branches: [main, master, feat/**]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ufrj_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      ENV: test
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ufrj_test
      SECRET_KEY: chave-secreta-de-teste-com-32-caracteres
      DATABASE_ECHO: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Aguardar MySQL
        run: python scripts/wait_for_db.py

      - name: Executar testes
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=0

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t gestor-prontuarios:ci .
