services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ufrj
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uadmin", "-padmin"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENV: production
      DATABASE_URL: mysql+pymysql://admin:admin@db:3306/ufrj
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-em-producao-min-32-chars}
      DATABASE_ECHO: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
